[project]
name = "localpdf-intelligence"
version = "0.1.0"
description = "Local PDF RAG pipeline with a benchmarking and model-comparison engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.23", "rapidocr_onnxruntime>=1.3"]
models = ["torch>=2.1", "transformers>=4.40", "sentence-transformers>=2.7", "accelerate>=0.30"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["localpdf*"]

[tool.setuptools.package-data]
localpdf = ["web/*", "web/assets/*"]
